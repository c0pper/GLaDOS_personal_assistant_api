services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: never
    container_name: glados_api
    ports:
      - "7000:8000"

    environment:
      TZ: Europe/Rome
      PYTHONPATH: /app
      UV_NO_DEV: "1"
      # example variables
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      # Shared secret every /api endpoint requires in the X-API-Key header.
      GLADOS_API_KEY: ${GLADOS_API_KEY}
      SEARXNG_URL: http://192.168.1.4:8899
      VIKUNJA_BASE_URL: http://192.168.1.4:3456/api/v1
      VIKUNJA_TOKEN: ${VIKUNJA_TOKEN}
      HA_MCP_URL: ${HA_MCP_URL}
      GROCY_MCP_URL: http://192.168.1.4:8448/mcp
      HOME_ASSISTANT_BASE_URL: http://192.168.1.144:8123
      HOME_ASSISTANT_TOKEN: ${HOME_ASSISTANT_TOKEN}
      # Speech-to-text: OpenRouter first, Home Assistant's Whisper as a fallback.
      OPENROUTER_STT_MODEL: openai/gpt-4o-mini-transcribe
      HOME_ASSISTANT_STT_ENTITY: stt.faster_whisper
      HOME_ASSISTANT_STT_LANGUAGE: en
      HOME_ASSISTANT_TTS_MEDIA_PLAYER: media_player.minisgooglehome_2
      HOME_ASSISTANT_TTS_ENTITY: tts.piper
      HOME_ASSISTANT_TTS_VOICE: glados
      # Optional fast routing through Jev; disabled until evaluated with scripts/jev_benchmark.py.
      JEV_ENABLED: ${JEV_ENABLED:-false}
      JEV_MODEL: ${JEV_MODEL:-typesafe/jev-1.14}

    volumes:
      - ./db:/app/db

    restart: unless-stopped

  telegram_bot:
    build:
      context: ./telegram_bot
      dockerfile: Dockerfile
    pull_policy: never
    container_name: glados_telegram_bot
    depends_on:
      - app

    environment:
      TZ: Europe/Rome
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
      # Comma-separated chat ids the bot answers; everyone else is ignored.
      TELEGRAM_ALLOWED_CHAT_IDS: ${TELEGRAM_ALLOWED_CHAT_IDS}
      # Same shared secret as the app: the bot sends it as X-API-Key.
      GLADOS_API_KEY: ${GLADOS_API_KEY}
      # The API service on the compose network (its container port, not the published one).
      GLADOS_API_URL: http://app:8000

    restart: unless-stopped
